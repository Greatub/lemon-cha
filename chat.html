<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lemon cha</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <aside class="sidebar" aria-label="对话历史">
        <div class="brand">
          <div class="brand-lockup">
            <span class="brand-wordmark" aria-label="lemon cha">lemon cha</span>
          </div>
          <button id="sidebarToggle" class="icon-button" type="button" aria-label="隐藏侧栏">
            <span class="icon-slot" data-icon="panelLeft" aria-hidden="true"></span>
          </button>
        </div>

        <div class="sidebar-primary">
          <button id="newChat" type="button" class="sidebar-text-button new-chat-button">
            <span class="icon-slot" data-icon="messagePlus" aria-hidden="true"></span>
            <span class="menu-label">新建对话</span>
          </button>
          <button id="sidebarTranslateTool" type="button" class="sidebar-text-button sidebar-translate-button">
            <span class="icon-slot" data-icon="languages" aria-hidden="true"></span>
            <span class="menu-label">翻译</span>
          </button>
          <button id="conversationSearchToggle" type="button" class="sidebar-text-button conversation-search-button" aria-expanded="false" aria-controls="conversationSearchPanel">
            <span class="icon-slot" data-icon="search" aria-hidden="true"></span>
            <span class="menu-label">搜索对话</span>
          </button>
          <div id="conversationSearchPanel" class="conversation-search-panel hidden">
            <label class="visually-hidden" for="conversationSearchInput">搜索对话</label>
            <input id="conversationSearchInput" class="conversation-search-input" type="search" placeholder="搜索标题或内容" autocomplete="off">
          </div>
        </div>

        <nav class="conversation-list" aria-label="对话列表">
          <div class="sidebar-actions conversation-tools" aria-label="对话管理">
            <div class="conversation-tools-label" data-i18n="foldersLabel">文件夹</div>
            <button id="newFolder" type="button" class="sidebar-text-button">
              <span class="icon-slot" data-icon="folderPlus" aria-hidden="true"></span>
              <span class="menu-label">新建文件夹</span>
            </button>
          </div>
          <div id="conversationList" class="conversation-list-body"></div>
        </nav>

        <div class="sidebar-footer">
          <button id="settingsToggle" type="button" class="sidebar-text-button sidebar-settings-button" aria-expanded="false">
            <span class="icon-slot" data-icon="settings" aria-hidden="true"></span>
            <span class="menu-label">设置</span>
          </button>
          <button id="themeToggle" class="icon-button" type="button" aria-label="夜间模式" aria-pressed="false">
            <span class="icon-slot" data-icon="moon" aria-hidden="true"></span>
          </button>
        </div>
      </aside>

      <section class="workspace">
        <header class="chat-toolbar">
          <div class="chat-status">
            <h2 id="chatTitle" class="chat-title">新对话</h2>
          </div>
        </header>

        <section id="settingsPanel" class="settings hidden" aria-label="模型设置">
          <div class="settings-surface" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <div class="settings-page-header">
              <div>
                <h2 id="settingsTitle" data-i18n="settingsTitle">设置</h2>
              </div>
            </div>
            <div class="settings-body">
              <div class="settings-tabs" role="tablist" aria-label="设置分类">
                <button id="generalSettingsTab" class="settings-tab active" type="button" role="tab" aria-selected="true" aria-controls="generalSettingsPanel" data-tab="general" data-i18n="generalSettingsTab">通用设置</button>
                <button id="modelSettingsTab" class="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="modelSettingsPanel" data-tab="model" data-i18n="modelSettingsTab">模型设置</button>
                <button id="promptSettingsTab" class="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="promptSettingsPanel" data-tab="prompt" data-i18n="promptSettingsTab">提示词预设</button>
                <button id="dataSettingsTab" class="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="dataSettingsPanel" data-tab="data" data-i18n="dataSettingsTab">数据与重置</button>
              </div>
              <form id="settingsForm" class="settings-form">
              <div id="generalSettingsPanel" class="settings-tab-panel active" role="tabpanel" aria-labelledby="generalSettingsTab">
                <label>
                  <span data-i18n="interfaceLanguage">界面语言</span>
                  <select id="languageInput">
                    <option value="zh-CN" data-i18n="languageChinese">简体中文</option>
                    <option value="zh-TW" data-i18n="languageTraditionalChinese">繁體中文</option>
                    <option value="en-US" data-i18n="languageEnglish">English</option>
                    <option value="fr-FR" data-i18n="languageFrench">Français</option>
                    <option value="de-DE" data-i18n="languageGerman">Deutsch</option>
                    <option value="ja-JP" data-i18n="languageJapanese">日本語</option>
                    <option value="ko-KR" data-i18n="languageKorean">한국어</option>
                    <option value="es-ES" data-i18n="languageSpanish">Español</option>
                  </select>
                </label>
                <label>
                  <span data-i18n="answerLanguage">默认回答语言</span>
                  <select id="answerLanguageInput">
                    <option value="zh-CN" data-i18n="languageChinese">简体中文</option>
                    <option value="zh-TW" data-i18n="languageTraditionalChinese">繁體中文</option>
                    <option value="en-US" data-i18n="languageEnglish">English</option>
                    <option value="fr-FR" data-i18n="languageFrench">Français</option>
                    <option value="de-DE" data-i18n="languageGerman">Deutsch</option>
                    <option value="ja-JP" data-i18n="languageJapanese">日本語</option>
                    <option value="ko-KR" data-i18n="languageKorean">한국어</option>
                    <option value="es-ES" data-i18n="languageSpanish">Español</option>
                  </select>
                </label>
                <label>
                  <span data-i18n="translationStyle">翻译风格</span>
                  <select id="translationStyleInput">
                    <option value="balanced" data-i18n="translationStyleBalanced">自然准确</option>
                    <option value="faithful" data-i18n="translationStyleFaithful">忠实原文</option>
                    <option value="polished" data-i18n="translationStylePolished">流畅润色</option>
                    <option value="professional" data-i18n="translationStyleProfessional">专业正式</option>
                  </select>
                </label>
                <label>
                  <span data-i18n="fontSizeLabel">字体大小</span>
                  <select id="fontSizeInput">
                    <option value="small" data-i18n="fontSizeSmall">小（默认）</option>
                    <option value="large" data-i18n="fontSizeLarge">大</option>
                  </select>
                </label>
                <label>
                  <span data-i18n="colorSchemeLabel">配色方案</span>
                  <select id="colorSchemeInput">
                    <option value="llmon" data-i18n="colorSchemeLlmon">lemon cha 默认（日间 / 夜间）</option>
                    <option value="leaf" data-i18n="colorSchemeLeaf">叶绿清新（日间 / 夜间）</option>
                    <option value="citrus" data-i18n="colorSchemeCitrus">柑橘暖阳（日间 / 夜间）</option>
                    <option value="blue" data-i18n="colorSchemeBlue">湖蓝清爽（日间 / 夜间）</option>
                    <option value="gray" data-i18n="colorSchemeGray">暖灰简洁（日间 / 夜间）</option>
                  </select>
                </label>
              </div>
              <div id="modelSettingsPanel" class="settings-tab-panel hidden" role="tabpanel" aria-labelledby="modelSettingsTab">
                <label id="presetField">
                  <span data-i18n="modelPreset">模型服务预设</span>
                  <select id="presetInput">
                    <option value="custom" data-i18n="presetCustom">自定义</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="openai">OpenAI</option>
                    <option value="qwen">通义千问 / DashScope</option>
                    <option value="kimi">Kimi / Moonshot</option>
                    <option value="siliconflow">SiliconFlow</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="groq">Groq</option>
                    <option value="ollama-proxy" data-i18n="presetOllamaProxy">Ollama 本地模型</option>
                  </select>
                </label>
                <label>
                  <span data-i18n="baseUrl">接口地址</span>
                  <input id="endpointInput" type="url" placeholder="https://api.example.com/v1/chat/completions">
                </label>
                <label>
                  <span data-i18n="modelName">模型名称</span>
                  <input id="modelInput" type="text" placeholder="deepseek-v4-flash / gpt-4o-mini / llama3.1">
                </label>
                <label id="ollamaModelField" class="hidden">
                  <span data-i18n="localModelList">本地模型列表</span>
                  <select id="ollamaModelSelect">
                    <option value="" data-i18n="testFirst">先测试连接</option>
                  </select>
                </label>
                <label id="customFormatField">
                  <span data-i18n="apiFormat">接口格式</span>
                  <select id="customFormatInput">
                    <option value="openai">OpenAI Chat Completions</option>
                    <option value="ollama">Ollama /api/chat</option>
                  </select>
                </label>
                <label id="apiKeyField">
                  <span>API Key</span>
                  <input id="apiKeyInput" type="password" placeholder="可留空" data-i18n-placeholder="optional">
                </label>
                <div class="form-row">
                  <label>
                    <span>Temperature</span>
                    <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0.7">
                  </label>
                  <label>
                    <span data-i18n="maxTokens">最大输出 Token</span>
                    <input id="maxTokensInput" type="number" min="128" max="128000" step="128" value="2048">
                  </label>
                </div>
                <div class="form-row">
                  <label>
                    <span data-i18n="historyLimit">最大上下文轮数</span>
                    <input id="historyLimitInput" type="number" min="1" max="30" step="1" value="12">
                  </label>
                  <label class="checkbox-label">
                    <span data-i18n="memoryEnabled">启用对话记忆</span>
                    <input id="memoryEnabledInput" type="checkbox" checked>
                  </label>
                </div>
                <label>
                  <span data-i18n="defaultPromptPreset">默认提示词预设</span>
                  <select id="defaultPresetInput">
                    <option value="" data-i18n="noDefaultPreset">不绑定</option>
                  </select>
                </label>
                <label class="wide-field">
                  <span data-i18n="systemPrompt">系统提示词</span>
                  <textarea id="systemPromptInput" rows="5"></textarea>
                </label>
              </div>
              <div id="promptSettingsPanel" class="settings-tab-panel hidden prompt-settings-panel" role="tabpanel" aria-labelledby="promptSettingsTab">
                <label>
                  <span data-i18n="promptTemplateManage">模板</span>
                  <select id="promptTemplateManageSelect">
                    <option value="" data-i18n="newPromptTemplate">新建模板</option>
                  </select>
                </label>
                <label>
                  <span data-i18n="promptTemplateNameLabel">模板名称</span>
                  <input id="promptTemplateNameInput" type="text" maxlength="40">
                </label>
                <label class="wide-field">
                  <span data-i18n="promptTemplateContentLabel">模板内容</span>
                  <textarea id="promptTemplateContentInput" rows="5"></textarea>
                </label>
                <div class="settings-actions wide-field">
                  <button id="savePromptTemplate" type="button">保存模板</button>
                  <button id="savePromptTemplateAs" class="secondary" type="button">另存为新模板</button>
                  <button id="deletePromptTemplate" class="secondary danger" type="button">删除模板</button>
                </div>
              </div>
              <div id="dataSettingsPanel" class="settings-tab-panel hidden data-settings-panel" role="tabpanel" aria-labelledby="dataSettingsTab">
                <div class="settings-section wide-field">
                  <h3 data-i18n="resetSectionTitle">分区重置</h3>
                  <p data-i18n="resetSectionHint">每个重置操作只影响对应区域。</p>
                  <div class="reset-action-list">
                    <div class="reset-action">
                      <div>
                        <strong data-i18n="resetGeneralSettings">重置通用设置</strong>
                        <p data-i18n="resetGeneralHelp">仅恢复语言、主题、字体和配色，不影响模型、提示词和对话。</p>
                      </div>
                      <button id="resetGeneralSettings" type="button" class="secondary" data-i18n="resetCurrentSettings">重置</button>
                    </div>
                    <div class="reset-action">
                      <div>
                        <strong data-i18n="resetCurrentModelSettings">重置当前模型设置</strong>
                        <p data-i18n="resetModelHelp">仅重置当前选中的模型配置，不影响其他模型。</p>
                      </div>
                      <button id="resetCurrentModelSettings" type="button" class="secondary" data-i18n="resetCurrentSettings">重置</button>
                    </div>
                    <div class="reset-action">
                      <div>
                        <strong data-i18n="resetCurrentPromptTemplate">重置当前提示词预设</strong>
                        <p data-i18n="resetPromptHelp">仅恢复当前提示词预设编辑内容，不影响其他预设。</p>
                      </div>
                      <button id="resetCurrentPromptTemplate" type="button" class="secondary" data-i18n="resetCurrentSettings">重置</button>
                    </div>
                  </div>
                </div>
                <div class="settings-section clear-history-section wide-field">
                  <h3 data-i18n="clearHistoryTitle">对话历史</h3>
                  <p data-i18n="clearHistoryHelp">清空所有对话历史，并创建一个空白新对话。设置、模型和提示词预设会保留。</p>
                  <button id="clearHistorySettings" type="button" class="secondary danger" data-i18n="clearHistorySettings">清空对话历史</button>
                </div>
                <div class="settings-section danger-section wide-field">
                  <h3 data-i18n="factoryResetTitle">恢复出厂设置</h3>
                  <p data-i18n="factoryResetHint">会清空设置、模型配置、提示词预设和对话历史。</p>
                  <button id="factoryResetSettings" type="button" class="danger">恢复出厂设置</button>
                </div>
              </div>
              <div class="settings-actions settings-footer-actions hidden">
                <button id="saveSettings" type="submit">保存</button>
              </div>
              </form>
            </div>
          </div>
        </section>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="chatForm" class="composer">
          <div class="composer-box">
            <button id="scrollToBottom" class="scroll-to-bottom hidden" type="button" aria-label="回到最新消息">
              <span class="icon-slot" data-icon="chevronDown" aria-hidden="true"></span>
            </button>
            <textarea id="promptInput" rows="3" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
            <div class="composer-actions">
              <select id="toolbarModelSelect" aria-label="当前模型">
                <option value="">未配置</option>
              </select>
              <select id="promptTemplateSelect" aria-label="Prompt 预设">
                <option value="">选择 Prompt 预设</option>
              </select>
              <select id="translationTargetSelect" aria-label="目标语言">
                <option value="zh-CN" data-i18n="languageChinese">简体中文</option>
                <option value="zh-TW" data-i18n="languageTraditionalChinese">繁體中文</option>
                <option value="en-US" data-i18n="languageEnglish">English</option>
                <option value="fr-FR" data-i18n="languageFrench">Français</option>
                <option value="de-DE" data-i18n="languageGerman">Deutsch</option>
                <option value="ja-JP" data-i18n="languageJapanese">日本語</option>
                <option value="ko-KR" data-i18n="languageKorean">한국어</option>
                <option value="es-ES" data-i18n="languageSpanish">Español</option>
              </select>
              <div class="composer-send-actions">
                <button id="composerModeToggle" class="secondary composer-mode-button" type="button" aria-pressed="false">对话</button>
                <button id="thinkingToggle" class="secondary" type="button" aria-pressed="false">思考</button>
                <button id="sendButton" type="submit">发送</button>
                <button id="stopButton" class="danger hidden" type="button">停止</button>
              </div>
            </div>
          </div>
        </form>
      </section>
    </main>
    <div id="toastRoot" class="toast-root" aria-live="polite">
      <div id="toast" class="toast hidden" role="status"></div>
    </div>
    <script src="src/components/AppIcon.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
